name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SpokaSoundBoard.sln

      - name: Build
        run: dotnet build SpokaSoundBoard.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/SpokaSoundBoard.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/SpokaSoundBoard.Tests/TestResults/*.trx
