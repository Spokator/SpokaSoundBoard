name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Merci de prendre le temps de signaler un problème ! Plus vous donnez de détails, plus il sera corrigé vite.
  - type: textarea
    id: what
    attributes:
      label: Que se passe-t-il ?
      description: Décrivez le problème et comment le reproduire.
      placeholder: "Ex. : la musique se coupe sur Discord toutes les 30 secondes quand…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qu'attendiez-vous ?
  - type: textarea
    id: report
    attributes:
      label: Rapport de diagnostic
      description: >-
        Dans SpokaSoundBoard, ouvrez Configuration → Aide et signalement → « Copier le rapport de diagnostic »,
        puis collez-le ici (Ctrl+V). Il contient la version, les périphériques audio, les compteurs de coupures et les dernières erreurs.
      render: text
  - type: input
    id: version
    attributes:
      label: Version de SpokaSoundBoard (si vous n'avez pas pu copier le rapport)
      description: Visible dans Configuration → À propos.
      placeholder: "2.5.0"
  - type: textarea
    id: setup
    attributes:
      label: Configuration
      description: Micros virtuels installés (VB-CABLE, Virtual Audio Cable…), jeu / Discord utilisés.
